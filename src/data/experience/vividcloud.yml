content:
  company: VividCloud
  role: Senior DevOps Engineer
  startDate: "2022-11"
  endDate: Present
  description: "30% GCP cost reduction via shared review-app infrastructure (replacing full-stack per-MR environments), Cloud Run scale-to-zero for non-production services, and build pipeline cleanup (eliminating unnecessary container builds on every commit). Serving parallel AWS and GCP client engagements."
  technologies:
    - GCP
    - Terraform
    - GitLab CI
    - AWS
    - Terragrunt
    - OpenTofu
    - LocalStack
    - AWS SAM
    - Cognito
    - KMS
    - Secrets Manager
    - ECR
  key_deliverables:
    - title: Cloud Cost Optimization Initiative
      description: Led an initiative resulting in a 30% reduction in monthly infrastructure expenses across all environments.
      technologies:
        - GCP
        - Terraform
        - Cost Management
    - title: Dynamic Preview Environments
      description: Designed and implemented scalable preview environments tied to GitLab merge requests to improve testing efficiency.
      technologies:
        - GitLab
        - Terraform
        - GCP
    - title: AWS Cognito Authentication
      description: Implemented AWS Cognito-based authentication system with user pools, MFA, and federated identity for secure application access.
      technologies:
        - AWS Cognito
        - IAM
        - Lambda
        - API Gateway
    - title: Certificate Management Automation
      description: Implemented automated SSL certificate renewal system with GCP Secret Manager and Pub/Sub.
      technologies:
        - GCP Secret Manager
        - Pub/Sub
        - Terraform
        - GitLab CI
    - title: Terraform Documentation Automation
      description: Engineered comprehensive automation generating standardized README files, usage examples, and configuration templates with automatic updates.
      technologies:
        - Terraform
        - terraform-docs
        - GitLab CI
    - title: Multi-account AWS infrastructure with Terragrunt
      description: Designed and maintain Terragrunt modules across five environments (dev/stage/prod plus sandbox/local), with shared baseline modules and per-environment overrides.
      technologies:
        - Terragrunt
        - OpenTofu
        - AWS
        - Lambda
        - DynamoDB
        - S3
        - Cognito
        - API Gateway
        - GitLab CI
    - title: Layered local AWS development with LocalStack and SAM
      description: "Built a layered local development experience: a fully-local mode using LocalStack for offline iteration, and a hybrid mode using SAM CLI bootstrapped against deployed AWS dev resources for richer integration testing. Keeps cloud bills off engineers writing unit tests."
      technologies:
        - LocalStack
        - Docker Compose
        - Terragrunt
        - AWS SAM
        - AWS CLI
    - title: Per-merge-request preview environments on GCP
      description: On a previous client engagement, built per-merge-request preview environments on GCP / Cloud Run so reviewers could click around real infrastructure on each open MR instead of relying on screenshots or local repros.
      technologies:
        - GCP
        - Cloud Run
        - Cloud SQL
        - Cloud DNS
        - Cloud Storage
        - GitLab CI
        - Terraform
    - title: Observability-as-code with CloudWatch
      description: "Treated CloudWatch alarms and dashboards as code — error-rate metric math, per-environment retention tiers, master enable/disable switches, and SNS routing to email and Teams webhooks across multiple environments."
      technologies:
        - CloudWatch
        - SNS
        - Terraform
        - Teams
    - title: Secret management across AWS and GCP
      description: "Shipped secret-management implementations across two client engagements. On AWS: moved vendor API keys and service credentials from CI variables into Secrets Manager, with Lambda-side caching at cold start. On GCP: automated certificate rotation triggered by Pub/Sub with Secret Manager as the store, eliminating manual cert-swap downtime."
      technologies:
        - AWS Secrets Manager
        - GCP Secret Manager
        - Pub/Sub
        - Lambda
        - Terraform
        - Terragrunt
    - title: Monitoring stack migration from Datadog to GCP Cloud Monitoring
      description: "Led migration of a client's monitoring stack from Datadog to GCP Cloud Monitoring — rebuilding dashboards and alarm routes while maintaining SLO coverage during the cutover. Standardized alert routing across email, Teams, and Slack."
      technologies:
        - Datadog
        - GCP Cloud Monitoring
        - Terraform
    - title: CI/CD reliability guardrails
      description: "Hardened CI pipelines to block broken code from reaching downstream environments — parallelized jobs with automated smoke tests, static-analysis and database-changelog validation, SAST/DAST-style scanning, and build-success-gated release automation."
      technologies:
        - GitLab CI
        - GCP
        - AWS
        - Terraform
    - title: Automated IaC documentation with terraform-docs
      description: Integrated terraform-docs into CI pipelines to auto-generate and keep Terraform module documentation in sync with HCL source, reducing IaC onboarding friction and doc drift.
      technologies:
        - terraform-docs
        - Terraform
        - GitLab CI
    - title: Department IAM ownership on GCP
      description: "Owned IAM design and administration across a GCP department engagement — role bindings, custom roles, service-account hygiene, and least-privilege enforcement across multiple projects."
      technologies:
        - GCP IAM
        - Terraform

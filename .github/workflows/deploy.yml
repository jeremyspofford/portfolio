name: Deploy Portfolio

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    id-token: write # Required for OIDC
    contents: read

jobs:
    deploy:
        name: Deploy
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: us-east-1

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: 1.10.0

            - name: Terraform Init
              working-directory: terraform
              run: terraform init

            - name: Terraform Apply
              working-directory: terraform
              run: terraform apply -auto-approve
              # Note: In a real scenario, we might want to plan first or use a separate job.

            - name: Install Frontend Dependencies
              working-directory: src
              run: npm ci

            - name: Build Frontend
              working-directory: src
              run: npm run build

            - name: Sync Frontend to S3
              working-directory: src
              # Using the output from terraform or hardcoding bucket name if known/stable
              # For robustness, we can fetch the bucket name from Terraform output
              run: |
                  BUCKET_NAME=$(cd ../terraform && terraform output -raw s3_bucket_name)
                  echo "Deploying to bucket: $BUCKET_NAME"
                  aws s3 sync out/ s3://$BUCKET_NAME --delete

            - name: Invalidate CloudFront Cache
              run: |
                  DIST_ID=$(cd terraform && terraform output -raw cloudfront_distribution_id)
                  echo "Invalidating distribution: $DIST_ID"
                  aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"

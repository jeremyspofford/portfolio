name: Deploy Portfolio

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - prod

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    env:
      # Determine environment based on branch or manual input
      ENVIRONMENT: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'staging') }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Select or Create Terraform Workspace
        working-directory: terraform
        run: |
          terraform workspace select ${{ env.ENVIRONMENT }} || terraform workspace new ${{ env.ENVIRONMENT }}

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve -var-file=environments/${{ env.ENVIRONMENT }}.tfvars

      - name: Get Terraform Outputs
        id: tf_outputs
        working-directory: terraform
        run: |
          echo "api_url=$(terraform output -raw api_endpoint)" >> $GITHUB_OUTPUT
          echo "bucket_name=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
          echo "cloudfront_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT
          echo "site_url=$(terraform output -raw site_url)" >> $GITHUB_OUTPUT

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: src
        run: npm ci

      - name: Build Frontend
        working-directory: src
        env:
          NEXT_PUBLIC_API_URL: ${{ steps.tf_outputs.outputs.api_url }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.tf_outputs.outputs.site_url }}
          # Feature flags: all ON for staging, all OFF for prod
          NEXT_PUBLIC_SHOW_RESUME_DOWNLOAD: ${{ env.ENVIRONMENT == 'staging' && 'true' || 'false' }}
          NEXT_PUBLIC_SHOW_CONTRIBUTIONS: ${{ env.ENVIRONMENT == 'staging' && 'true' || 'false' }}
          NEXT_PUBLIC_ENABLE_AI: ${{ env.ENVIRONMENT == 'staging' && 'true' || 'false' }}
          NEXT_PUBLIC_ENABLE_CONTACT_FORM: ${{ env.ENVIRONMENT == 'staging' && 'true' || 'false' }}
          NEXT_PUBLIC_SHOW_PROJECTS: "true"
          NEXT_PUBLIC_ENVIRONMENT: ${{ env.ENVIRONMENT }}
          # Only include GA ID for production
          NEXT_PUBLIC_GA_ID: ${{ env.ENVIRONMENT == 'prod' && vars.NEXT_PUBLIC_GA_ID || '' }}
          # GitHub tokens for contributions
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: npm run build

      - name: Sync Frontend to S3
        run: |
          aws s3 sync src/out/ s3://${{ steps.tf_outputs.outputs.bucket_name }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.tf_outputs.outputs.cloudfront_id }} \
            --paths "/*"

      - name: Deployment Summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "**Site URL:** ${{ steps.tf_outputs.outputs.site_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**API URL:** ${{ steps.tf_outputs.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
